[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industrial-visual-defect-detection"
version = "0.1.0"
description = "Local-first visual anomaly detection research workbench"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Rana Jahanzaib"}]
keywords = ["computer-vision", "anomaly-detection", "industrial-inspection", "pytorch", "visa-dataset"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.26", "Pillow>=10", "scikit-learn>=1.4", "safetensors>=0.4", "PyYAML>=6", "matplotlib>=3.8", "opencv-python-headless>=4.9", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[project.urls]
Homepage = "https://github.com/ranajahanzaib/industrial-visual-defect-detection"
Repository = "https://github.com/ranajahanzaib/industrial-visual-defect-detection"
Issues = "https://github.com/ranajahanzaib/industrial-visual-defect-detection/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.3", "mypy>=1.9", "httpx>=0.27", "httpx2>=2.16"]

[project.scripts]
industrial-visual-defect-detection = "industrial_visual_defect_detection.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_visual_defect_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"src/industrial_visual_defect_detection/api/app.py" = ["B008"]

